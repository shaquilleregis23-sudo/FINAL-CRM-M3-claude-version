font-size:1.2rem}.disp span{font-size:.72rem;color:#dbeafe}.owner-card{font-size:.88rem;line-height:1.35;color:#e5e7eb}.owner-card b{color:#fff}.owner-card .mini{color:#94a3b8;font-size:.78rem}.toast-wrap{position:fixed;right:16px;bottom:84px;z-index:2000;display:grid;gap:8px}.toast{background:rgba(15,23,42,.97);border:1px solid rgba(56,189,248,.36);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);min-width:230px;animation:toastIn .23s ease both}@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.hidden{display:none!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0f172a;color:#fff;border:1px solid rgba(148,163,184,.22)}.leaflet-popup-content{margin:12px}.leaflet-control-layers,.leaflet-control-zoom a{background:#0f172a!important;color:#fff!important;border-color:rgba(148,163,184,.25)!important}.lead-marker{background:#38bdf8;border:3px solid #fff;border-radius:999px;width:18px;height:18px;box-shadow:0 0 0 7px rgba(56,189,248,.18)}.hot-marker{background:#22c55e}.cold-marker{background:#f59e0b}.lost-marker{background:#ef4444}.pluto-label{background:rgba(2,6,23,.84);border:1px solid rgba(56,189,248,.45);color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.25)}@media(max-width:1250px){.dashboard{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}.map-shell{grid-template-rows:auto 65vh auto}.controls{grid-template-columns:1fr 1fr}.map-toolbar{grid-template-columns:1fr 1fr 1fr}.dispositions{grid-template-columns:repeat(5,1fr)}}@media(max-width:720px){.app{padding:12px 10px 96px}.topbar{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.dashboard{grid-template-columns:repeat(2,1fr)}.form-grid,.controls{grid-template-columns:1fr}.map-toolbar{grid-template-columns:1fr 1fr}.map-shell{grid-template-rows:auto 62vh auto}.dispositions{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){.dashboard{grid-template-columns:1fr}.dispositions{grid-template-columns:repeat(2,1fr)}}

<div class="app"><header class="topbar"><div class="brand"><div class="logo">M2</div><div><h1>M2 CRM v4.0 Field Map</h1><p>Live territory map • NYC PLUTO owner lookup • Solar/HVAC lead tracking</p></div></div><div class="actions"><button class="btn small" id="saveBtn">💾 Save</button><button class="btn small" id="exportJson">⬇️ Backup</button><label class="btn small" for="importJson">⬆️ Import</label><input class="hidden" id="importJson" type="file" accept="application/json"><button class="btn small" id="exportCsv">📊 CSV</button></div></header><section class="grid dashboard" id="dashboard"></section><main class="layout"><aside class="panel" id="accounts"><div class="panel-head"><h2>Customer Account</h2><span class="badge" id="lastSaved">Not saved yet</span></div><div class="panel-body"><form id="leadForm"><input type="hidden" id="leadId"><input type="hidden" id="lat"><input type="hidden" id="lng"><input type="hidden" id="bbl"><input type="hidden" id="plutoOwner"><div class="form-grid"><div class="field"><label>Full Name</label><input id="fullName" required placeholder="Homeowner / contact"></div><div class="field"><label>Phone</label><input id="phone" placeholder="(718) 555-1212"></div><div class="field full"><label>Address</label><input id="address" placeholder="Click map or type address"></div><div class="field"><label>Borough / City</label><input id="borough" placeholder="Queens, Brooklyn..."></div><div class="field"><label>Homeowner</label><select id="homeownerStatus"><option>Unknown</option><option>Homeowner</option><option>Renter</option><option>Decision Maker</option><option>Needs Spouse Approval</option></select></div><div class="field"><label>Utility</label><input id="utilityCompany" placeholder="Con Edison, PSEG"></div><div class="field"><label>Avg Bill</label><input id="averageBill" type="number" min="0" placeholder="250"></div><div class="field"><label>Heating</label><select id="heatingType"><option>Unknown</option><option>Gas Heating</option><option>Oil xtarea id="notes" placeholder="Objection, pain point, next move..."></textarea></div></div><div class="form-actions"><button class="btn primary" type="submit">➕ Save Lead</button><button class="btn" id="clearBtn" type="button">Clear</button><button class="btn good" id="locateBtn" type="button">📍 My Location</button></div></form><h2 style="font-size:1rem;margin:18px 0 10px">Disposition Action Area</h2><div class="dispositions" id="dispositions"></div></div></aside><section class="panel map-shell" id="fieldMap"><div class="map-toolbar"><input id="addressSearch" placeholder="Search NYC address or owner name..."><button class="btn primary" id="searchAddress">🔎 Search</button><button class="btn" id="loadPluto">🏠 Load PLUTO Homes</button><button class="btn" id="clearPluto">🧹 Clear PLUTO</button><button class="btn" id="fitLeads">🎯 Fit Leads</button><span class="map-status" id="mapStatus">Map ready</span></div><div id="map"></div><div class="map-bottom"><div class="controls"><input id="searchInput" placeholder="Search saved leads..."><select id="statusFilter"><option value="">All Statuses</option></select><select id="pipelineFilter"><option value="">All Pipeline</option></select><select id="solarFilter"><option value="">All Solar</option></select><select id="heatingFilter"><option value="">All Heating</option></select><select id="mapMode"><option value="all">Show All Leads</option><option value="hot">Hot Leads</option><option value="today">Appointments Today</option><option value="due">Follow-Ups Due</option><option value="won">Closed Won</option></select></div><div class="quick"><span class="chip">🏠 PLUTO lots load in visible map area</span><span class="chip">🏷️ Owner labels show at zoom 18+</span><span class="chip">📍 GPS enabled</span></div><div class="lead-list" id="leadList"></div></div></section></main></div><div class="toast-wrap" id="toastWrap"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="m2_crm_v4_field_map",PLUTO_ENDPOINT="https://data.cityofnewyork.us/resource/64uk-42ks.geojson",PLUTO_FIELDS="the_geom,bbl,borough,block,lot,address,ownername,landuse,bldgclass,yearbuilt,unitsres,lotarea,bldgarea,zipcode";
const stages=["New Lead","Contacted","Appointment Set","Estimate Completed","Proposal Sent","Closed Won","Closed Lost","Follow Up Later","Not Qualified"],statuses=["New","Hot","Warm","Cold","Appointment Set","Follow Up","Closed Won","Closed Lost","Do Not Knock","Not Qualified"],solarStatuses=["Unknown","No Solar","Has Solar","Interested in Solar","Not Interested","Already Under Contract","Needs Roof Check","Needs Bill Review"],heatingTypes=["Unknown","Gas Heating","Oil Heating","Electric Heating","No Boiler"],disp=[["🏚️","Not Home"],["🚫","Not Interested"],["📞","Callback"],["📅","Appointment Set"],["📩","Bill Requested"],["🧾","Bill Received"],["⏰","Needs Follow-Up"],["✅","Closed Won"],["❌","Closed Lost"],["⛔","Do Not Knock"],["🔑","Renter"],["☀️","Already Has Solar"],["🛠️","Needs HVAC"],["❄️","Needs Mini Split"],["🔥","Gas Heating"],["🛢️","Oil Heating"]];
let state={lastSaved:null,selectedLeadId:null,leads:[]},map,leadLayer,plutoLayer,ownerLabelLayer,userMarker,lastPlutoBoundsKey="";const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),stamp=()=>new Date().toLocaleString(),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),uid=()=>"lead_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
function toast(msg){const e=document.createElement("div");e.className="toast";e.textContent=msg;$("toastWrap").appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),220)},2600)}
function save(show=false){state.lastSaved=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));renderSaved();if(show)toast("Saved.")}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(Array.isArray(p.leads))state={lastSaved:p.lastSaved||null,selectedLeadId:p.selectedLeadId||null,leads:p.leads};else seed()}else seed()}catch(e){console.error(e);seed();toast("Recovered from CRM storage issue.")}}
function seed(){state.leads=[{id:uid(),fullName:"Angela Rivera",phone:"(718) 555-0188",address:"Queens Village, NY",borough:"Queens",lat:40.7132,lng:-73.7415,homeownerStatus:"Homeowner",utilityCompany:"Con Edison",averageBill:"285",heatingType:"Gas Heating",solarStatus:"Interested in Solar",hvacInterest:"Interested in Mini Split",pipelineStage:"Appointment Set",leadStatus:"Hot",appointmentDate:today(),nextFollowUpDate:today(),assignedAgent:"Shaq",billFileName:"coned_bill.pdf",notes:"Wants lower bill and upstairs comfort.",history:[{action:"Demo created",timestamp:stamp()}],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},{id:uid(),fullName:"Michael Brown",phone:"(917) 555-0199",address:"Elmont, NY",borough:"Long Island",lat:40.7009,lng:-73.7129,homeownerStatus:"Homeowner",utilityCompany:"PSEG",averageBill:"190",heatingType:"Oil Heating",solarStatus:"Needs Roof Check",hvacInterest:"Needs HVAC",pipelineStage:"Follow Up Later",leadStatus:"Warm",appointmentDate:"",nextFollowUpDate:today(),assignedAgent:"Shaq",billFileName:"",notes:"Needs wife present.",history:[{action:"Demo created",timestamp:stamp()}],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}];save()}
function score(l){let s=0;if(["Homeowner","Decision Maker"].includes(l.homeownerStatus))s+=25;if(+l.averageBill>200)s+=20;if(["Interested in Solar","Needs Roof Check","Needs Bill Review"].includes(l.solarStatus))s+=20;if(["Interested in HVAC","Interested in Mini Split","Needs HVAC","Needs Mini Split"].includes(l.hvacInterest))s+=20;if(["Gas Heating","Oil Heating"].includes(l.heatingType))s+=15;if(l.pipelineStage==="Appointment Set"||l.leadStatus==="Appointment Set")s+=15;if(l.billFileName)s+=10;if(l.homeownerStatus==="Renter")s-=25;if(l.leadStatus==="Closed Lost"||l.solarStatus==="Not Interested"||l.hvacInterest==="Not Interested")s-=30;if(l.leadStatus==="Do Not Knock")s-=50;return Math.max(0,Math.min(100,s))}function label(s){return s>=70?"Hot Lead":s>=40?"Warm Lead":"Cold Lead"}function badge(s){return s>=70?"good":s>=40?"warn":""}function renderSaved(){$("lastSaved").textContent=state.lastSaved?"Saved "+new Date(state.lastSaved).toLocaleTimeString():"Not saved yet"}
function populate(){statuses.forEach(x=>$("statusFilter").insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));stages.forEach(x=>$("pipelineFilter").insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));solarStatuses.forEach(x=>$("solarFilter").insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));heatingTypes.forEach(x=>$("heatingFilter").insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));$("dispositions").innerHTML=disp.map(([i,t])=>`<button class="disp" data-disp="${esc(t)}"><b>${i}</b><span>${esc(t)}</span></button>`).join("")}
function initMap(){map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([40.713,-73.86],12);const streets=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"&copy; OpenStreetMap"}),esri=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,attribution:"Tiles &copy; Esri"});streets.addTo(map);L.control.layers({Street:streets,Satellite:esri},{}).addTo(map);leadLayer=L.layerGroup().addTo(map);plutoLayer=L.geoJSON(null,{style:()=>({color:"#38bdf8",weight:1,opacity:.65,fillColor:"#0ea5e9",fillOpacity:.08}),onEachFeature:onPluto}).addTo(map);ownerLabelLayer=L.layerGroup().addTo(map);map.on("click",e=>reverseFill(e.latlng.lat,e.latlng.lng));map.on("moveend zoomend",()=>{renderLeadMarkers();if(map.getZoom()>=16)debouncedLoadPluto()});renderLeadMarkers();setTimeout(()=>map.invalidateSize(),300)}
function markerClass(l){if(l.leadStatus==="Closed Lost"||l.leadStatus==="Do Not Knock")return"lost-marker";const s=score(l);return s>=70?"hot-marker":s<40?"cold-marker":""}function renderLeadMarkers(){if(!leadLayer)return;leadLayer.clearLayers();visibleLeads().forEach(l=>{if(!l.lat||!l.lng)return;const m=L.marker([+l.lat,+l.lng],{icon:L.divIcon({className:"",html:`<div class="lead-marker ${markerClass(l)}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})});m.bindPopup(`<div class="owner-card"><b>${esc(l.fullName)}</b><br>${esc(l.address||"No address")}<br><span class="mini">${esc(l.phone||"No phone")} • ${score(l)} ${label(score(l))}</span><br><button onclick="editLead('${l.id}')" class="btn small primary" style="margin-top:8px">Edit Lead</button></div>`);m.addTo(leadLayer)})}
function onPluto(feature,layer){const p=feature.properties||{},owner=p.ownername||"Owner not listed",addr=p.address||"Address not listed",bbl=p.bbl||"";layer.bindPopup(`<div class="owner-card"><b>${esc(addr)}</b><br>Owner/PLUTO: <b>${esc(owner)}</b><br><span class="mini">BBL ${esc(bbl)} • ${esc(p.borough||"")} • Land Use ${esc(p.landuse||"")}</span><br><span class="mini">Built ${esc(p.yearbuilt||"—")} • Units ${esc(p.unitsres||"—")} • Class ${esc(p.bldgclass||"—")}</span><br><button onclick="usePlutoFromLayer('${esc(owner).replace(/'/g,"&#39;")}','${esc(addr).replace(/'/g,"&#39;")}','${esc(bbl).replace(/'/g,"&#39;")}','${esc(p.borough||"").replace(/'/g,"&#39;")}')" class="btn small primary" style="margin-top:8px">Use for Lead</button></div>`);if(map.getZoom()>=18){const c=layer.getBounds&&layer.getBounds().getCenter?layer.getBounds().getCenter():null;if(c&&owner&&owner!=="Owner not listed")L.marker(c,{icon:L.divIcon({className:"pluto-label",html:esc(owner).slice(0,28),iconSize:null})}).addTo(ownerLabelLayer)}}
function decodeHtml(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value}window.usePlutoFromLayer=function(owner,addr,bbl,boro){$("plutoOwner").value=decodeHtml(owner);$("plutoDisplay").value=`${decodeHtml(owner)} • BBL ${decodeHtml(bbl)}`;$("address").value=decodeHtml(addr);$("bbl").value=decodeHtml(bbl);$("borough").value=decodeHtml(boro);toast("PLUTO owner info added to form.")}
let plutoTimer=null;function debouncedLoadPluto(){clearTimeout(plutoTimer);plutoTimer=setTimeout(loadPlutoLots,500)}async function loadPlutoLots(){if(!map)return;if(map.getZoom()<15){toast("Zoom closer to load PLUTO lots smoothly.");return}const b=map.getBounds(),key=[b.getNorth().toFixed(3),b.getWest().toFixed(3),b.getSouth().toFixed(3),b.getEast().toFixed(3),map.getZoom()].join(",");if(key===lastPlutoBoundsKey)return;lastPlutoBoundsKey=key;const where=`within_box(the_geom, ${b.getNorth()}, ${b.getWest()}, ${b.getSouth()}, ${b.getEast()})`,url=`${PLUTO_ENDPOINT}?$select=${encodeURIComponent(PLUTO_FIELDS)}&$where=${encodeURIComponent(where)}&$limit=750`;$("mapStatus").textContent="Loading NYC PLUTO lots...";try{const res=await fetch(url);if(!res.ok)throw new Error("PLUTO API error");const data=await res.json();plutoLayer.clearLayers();ownerLabelLayer.clearLayers();plutoLayer.addData(data);$("mapStatus").textContent=`PLUTO lots loaded: ${data.features?data.features.length:0}`;toast(`Loaded ${data.features?data.features.length:0} PLUTO tax lots.`)}catch(e){console.error(e);$("mapStatus").textContent="PLUTO lookup unavailable";toast("Could not load PLUTO. Try zooming in or refreshing.")}}
function clearPluto(){plutoLayer.clearLayers();ownerLabelLayer.clearLayers();lastPlutoBoundsKey="";$("mapStatus").textContent="PLUTO cleared"}async function geocode(q){const url=`https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=us&q=${encodeURIComponent(q+", New York")}`;const res=await fetch(url,{headers:{Accept:"application/json"}});return await res.json()}async function searchAddress(){const q=$("addressSearch").value.trim();if(!q)return toast("Type an address first.");$("mapStatus").textContent="Searching address...";try{const r=await geocode(q);if(!r.length){toast("No address found.");$("mapStatus").textContent="No result";return}const best=r[0];map.setView([+best.lat,+best.lon],18);reverseFill(+best.lat,+best.lon,best.display_name);$("mapStatus").textContent="Address found";setTimeout(loadPlutoLots,650)}catch(e){console.error(e);toast("Search failed.")}}
async function reverseFill(lat,lng,knownAddress=""){$("lat").value=lat.toFixed(6);$("lng").value=lng.toFixed(6);if(knownAddress){$("address").value=knownAddress;return}try{const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`),d=await res.json();$("address").value=d.display_name||`${lat.toFixed(6)}, ${lng.toFixed(6)}`;const a=d.address||{};$("borough").value=a.city_district||a.suburb||a.city||a.town||""}catch(e){$("address").value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`}}
function locate(){if(!navigator.geolocation)return toast("GPS not available.");navigator.geolocation.getCurrentPosition(pos=>{const{latitude,longitude}=pos.coords;map.setView([latitude,longitude],18);if(userMarker)userMarker.remove();userMarker=L.circleMarker([latitude,longitude],{radius:8,color:"#22c55e",fillColor:"#22c55e",fillOpacity:.6}).addTo(map).bindPopup("You are here").openPopup();reverseFill(latitude,longitude);loadPlutoLots()},()=>toast("Location permission denied or unavailable."),{enableHighAccuracy:true,timeout:9000})}
function formData(){const old=state.leads.find(l=>l.id===$("leadId").value),file=$("billUpload").files?.[0];return{id:$("leadId").value||uid(),fullName:$("fullName").value.trim(),phone:$("phone").value.trim(),address:$("address").value.trim(),borough:$("borough").value.trim(),lat:$("lat").value,lng:$("lng").value,bbl:$("bbl").value,plutoOwner:$("plutoOwner").value,homeownerStatus:$("homeownerStatus").value,utilityCompany:$("utilityCompany").value.trim(),averageBill:$("averageBill").value,heatingType:$("heatingType").value,solarStatus:$("solarStatus").value,hvacInterest:$("hvacInterest").value,pipelineStage:$("pipelineStage").value,leadStatus:$("leadStatus").value,appointmentDate:$("appointmentDate").value,nextFollowUpDate:$("nextFollowUpDate").value,assignedAgent:$("assignedAgent").value.trim(),billFileName:file?file.name:(old?.billFileName||""),notes:$("notes").value.trim(),history:old?.history||[],createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}}
function saveLead(e){e.preventDefault();const l=formData();if(!l.fullName)return toast("Full name is required.");l.history.unshift({action:state.leads.some(x=>x.id===l.id)?"Lead updated":"Lead created",timestamp:stamp()});const i=state.leads.findIndex(x=>x.id===l.id);if(i>=0)state.leads[i]=l;else state.leads.unshift(l);state.selectedLeadId=l.id;save();clearForm();renderAll();toast("Lead saved.")}function clearForm(){$("leadForm").reset();["leadId","lat","lng","bbl","plutoOwner"].forEach(x=>$(x).value="");$("plutoDisplay").value=""}
window.editLead=function(leadId){const l=state.leads.find(x=>x.id===leadId);if(!l)return;state.selectedLeadId=leadId;["leadId","fullName","phone","address","borough","lat","lng","bbl","plutoOwner","utilityCompany","averageBill","appointmentDate","nextFollowUpDate","assignedAgent","notes"].forEach(k=>{if($(k))$(k).value=l[k]||""});["homeownerStatus","heatingType","solarStatus","hvacInterest","pipelineStage","leadStatus"].forEach(k=>$(k).value=l[k]||$(k).options[0].value);$("plutoDisplay").value=l.plutoOwner?`${l.plutoOwner} • BBL ${l.bbl||""}`:"";window.scrollTo({top:0,behavior:"smooth"});toast("Lead loaded for editing.")}

function disposition(t){const l=selected();if(!l)return toast("Select a lead first.");l.history.unshift({action:t,timestamp:stamp()});l.updatedAt=new Date().toISOString();if(t==="Appointment Set"){l.leadStatus="Appointment Set";l.pipelineStage="Appointment Set"}else if(t==="Closed Won"){l.leadStatus="Closed Won";l.pipelineStage="Closed Won"}else if(t==="Closed Lost"){l.leadStatus="Closed Lost";l.pipelineStage="Closed Lost"}else if(t==="Do Not Knock"){l.leadStatus="Do Not Knock";l.pipelineStage="Not Qualified"}else if(t==="Renter"){l.homeownerStatus="Renter";l.leadStatus="Not Qualified";l.pipelineStage="Not Qualified"}else if(t==="Callback"||t==="Needs Follow-Up"){l.leadStatus="Follow Up";l.pipelineStage="Follow Up Later";if(!l.nextFollowUpDate)l.nextFollowUpDate=today()}else if(t==="Already Has Solar"){l.solarStatus="Has Solar"}else if(t==="Needs HVAC"){l.hvacInterest="Needs HVAC"}else if(t==="Needs Mini Split"){l.hvacInterest="Needs Mini Split"}else if(t==="Gas Heating"){l.heatingType="Gas Heating"}else if(t==="Oil Heating"){l.heatingType="Oil Heating"}else if(t==="Not Interested"){l.leadStatus="Cold"}save();renderAll();toast(`${t} added.`)}
function visibleLeads(){const q=$("searchInput")?.value.toLowerCase().trim()||"",status=$("statusFilter")?.value||"",pipe=$("pipelineFilter")?.value||"",solar=$("solarFilter")?.value||"",heat=$("heatingFilter")?.value||"",mode=$("mapMode")?.value||"all";return state.leads.filter(l=>{const hay=[l.fullName,l.phone,l.address,l.borough,l.notes,l.assignedAgent,l.plutoOwner,l.bbl].join(" ").toLowerCase();if(q&&!hay.includes(q))return false;if(status&&l.leadStatus!==status)return false;if(pipe&&l.pipelineStage!==pipe)return false;if(solar&&l.solarStatus!==solar)return false;if(heat&&l.heatingType!==heat)return false;if(mode==="hot"&&score(l)<70)return false;if(mode==="today"&&l.appointmentDate!==today())return false;if(mode==="due"&&!(l.nextFollowUpDate&&l.nextFollowUpDate<=today()))return false;if(mode==="won"&&l.pipelineStage!=="Closed Won")return false;return true}).sort((a,b)=>score(b)-score(a))}
function renderDashboard(){const total=state.leads.length,hot=state.leads.filter(l=>score(l)>=70).length,appt=state.leads.filter(l=>l.appointmentDate===today()).length,due=state.leads.filter(l=>l.nextFollowUpDate&&l.nextFollowUpDate<=today()).length,won=state.leads.filter(l=>l.pipelineStage==="Closed Won").length,mapped=state.leads.filter(l=>l.lat&&l.lng).length,bills=state.leads.filter(l=>l.billFileName).length,pluto=state.leads.filter(l=>l.plutoOwner).length;$("dashboard").innerHTML=[["Total Leads",total],["Mapped Leads",mapped],["Hot Leads",hot],["Appts Today",appt],["Follow-Ups Due",due],["Bills Uploaded",bills],["PLUTO Matched",pluto],["Closed Won",won]].map(x=>`<article class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></article>`).join("")}
function renderList(){const leads=visibleLeads();$("leadList").innerHTML=leads.length?leads.map(l=>{const s=score(l);return`<article class="lead-card"><div class="lead-top"><div><h3>${esc(l.fullName)}</h3><div class="meta">${esc(l.phone||"No phone")} • ${esc(l.address||"No address")}<br>${esc(l.plutoOwner?("PLUTO: "+l.plutoOwner):"No PLUTO owner attached")}</div></div><div><span class="badge ${badge(s)}">${s} ${label(s)}</span></div></div><div class="badges"><span class="badge">${esc(l.pipelineStage)}</span><span class="badge">${esc(l.solarStatus)}</span><span class="badge">${esc(l.heatingType)}</span>${l.billFileName?'<span class="badge good">Bill Uploaded</span>':''}${l.lat?'<span class="badge good">Mapped</span>':''}</div><div class="card-actions"><button class="btn small primary" onclick="state.selectedLeadId='${l.id}';save();toast('Selected')">Select</button><button class="btn small" onclick="editLead('${l.id}')">Edit</button><button class="btn small" onclick="flyLead('${l.id}')">Map</button><button class="btn small bad" onclick="delLead('${l.id}')">Delete</button></div></article>`}).join(""):`<div class="lead-card meta">No leads match this view.</div>`;renderLeadMarkers()}
window.flyLead=function(leadId){const l=state.leads.find(x=>x.id===leadId);if(!l||!l.lat||!l.lng)return toast("Lead has no map location yet.");map.setView([+l.lat,+l.lng],18)}function renderAll(){renderSaved();renderDashboard();renderList();renderLeadMarkers()}function fitLeads(){const pts=state.leads.filter(l=>l.lat&&l.lng).map(l=>[+l.lat,+l.lng]);if(!pts.length)return toast("No mapped leads yet.");map.fitBounds(pts,{padding:[40,40],maxZoom:17})}
function exportBackup(){download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),`m2-crm-v4-backup-${today()}.json`)}function exportCsv(){const headers=["Name","Phone","Address","Borough","Latitude","Longitude","BBL","PLUTO Owner","Homeowner","Utility","Average Bill","Heating","Solar","HVAC","Pipeline","Status","Appointment","Follow-Up","Agent","Bill File","Score","Notes"],rows=state.leads.map(l=>[l.fullName,l.phone,l.address,l.borough,l.lat,l.lng,l.bbl,l.plutoOwner,l.homeownerStatus,l.utilityCompany,l.averageBill,l.heatingType,l.solarStatus,l.hvacInterest,l.pipelineStage,l.leadStatus,l.appointmentDate,l.nextFollowUpDate,l.assignedAgent,l.billFileName,score(l),l.notes]),csv=[headers,...rows].map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");download(new Blob([csv],{type:"text/csv"}),`m2-crm-v4-leads-${today()}.csv`)}function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.leads))throw Error("bad");state={lastSaved:new Date().toISOString(),selectedLeadId:null,leads:d.leads};save();renderAll();toast("Backup imported.")}catch(e){toast("Invalid backup file.")}};r.readAsText(file)}
